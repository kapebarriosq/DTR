<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#3b2418"><link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icons/icon-192.png"><link rel="stylesheet" href="style.css"><title>KAPE' BAR-RIO DTR</title></head><body><main class="app"><section id="loginScreen" class="screen"><div class="card login-card"><b>KAPE' BAR-RIO</b><small>Daily Time Record</small><div class="cup">☕</div><h2>Barista Login</h2><form id="loginForm"><label>Employee ID</label><input id="username" required><label>Password</label><input id="password" type="password" required><p id="loginError"></p><button>LOG IN</button></form></div></section><section id="dashboardScreen" class="screen hidden"><header><div><b>KAPE' BAR-RIO</b><small>Daily Time Record</small></div><button id="logoutBtn" class="logout">LOG OUT</button></header><div class="card profile"><div class="avatar">☕</div><div><h2 id="employeeName"></h2><small id="employeeId"></small></div></div><div class="card time"><div id="currentDate"></div><div id="currentTime" class="clock"></div><strong id="statusText"></strong><p id="clockInDisplay"></p><div id="durationDisplay" class="duration"></div><button id="attendanceBtn" class="attendance">CLOCK IN</button><p id="actionMessage"></p></div><div class="card history"><h2>DTR History</h2><div id="historyEmpty">No completed DTR records yet.</div><div class="table"><table id="historyTable" class="hidden"><thead><tr><th>Date</th><th>In</th><th>Out</th><th>Total</th></tr></thead><tbody id="historyBody"></tbody></table></div></div></section></main><script src="app.js"></script></body></html>
